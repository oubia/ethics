name: RAG_Application
services:
  backend:
    build: ./backend
    container_name: rag-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./Vectorestor:/app/Vectorestor
      - ./docs:/app/docs
    env_file:
      - ./.env
    environment:
      - OLLAMA_REQUEST_TIMEOUT=600
      - REQUEST_TIMEOUT=600
    depends_on:
      - ollama
    networks:
      - rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: rag-frontend
    ports:
      - "8080:8080"
    environment:
      - REACT_APP_BASE_URL=http://localhost:8080/
    depends_on:
      - backend
    networks:
      - rag-network

  ollama:
    build:
      context: ./Ollama
      dockerfile: Dockerfile
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      /bin/sh -c "
        ollama list | grep -q 'llama-guard3:1b' || ollama pull llama-guard3:1b;
        ollama serve
      "
    networks:
      - rag-network

volumes:
  ollama_data:

networks:
  rag-network:
    driver: bridge
