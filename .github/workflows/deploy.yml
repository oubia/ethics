name: Deploy to Azure

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        run: |
          docker login -u "${{ secrets.AZURE_REGISTRY_USERNAME }}" --password-stdin "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}" <<< "${{ secrets.AZURE_REGISTRY_PASSWORD }}"

      - name: Build and push backend image
        run: |
          docker build -t "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:${{ github.sha }}" -t "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:latest" ./backend
          docker push "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:${{ github.sha }}"
          docker push "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:latest"
          echo "Backend image pushed: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:latest"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg REACT_APP_BASE_URL="https://api.ethics.oubia.me/" \
            -t "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:${{ github.sha }}" \
            -t "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest" \
            ./frontend
          docker push "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:${{ github.sha }}"
          docker push "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest"
          echo "Frontend image pushed: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest"

      - name: Build and push ollama image
        run: |
          docker build -t "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:${{ github.sha }}" -t "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:latest" ./Ollama
          docker push "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:${{ github.sha }}"
          docker push "${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:latest"
          echo "Ollama image pushed: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:latest"

      - name: Deploy notification
        run: |
          echo "✅ All images built and pushed to ACR successfully!"
          echo "Images available at:"
          echo "  - ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest"
          echo "  - ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:latest"
          echo "  - ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:latest"
          echo ""
          echo "Next steps:"
          echo "1. Go to Azure Portal → Container Instances"
          echo "2. Create new container with image: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest"
          echo "3. Update Namecheap DNS with Azure public IP"
