name: Deploy to Azure

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry with Docker CLI
        run: |
          echo '${{ secrets.AZURE_REGISTRY_PASSWORD }}' | docker login -u '${{ secrets.AZURE_REGISTRY_USERNAME }}' --password-stdin '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}'

      - name: Build and push backend image
        run: |
          docker build -t '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:latest' -t '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:${{ github.sha }}' ./backend
          docker push '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:latest'
          docker push '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:${{ github.sha }}'

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg REACT_APP_BASE_URL='https://api.ethics.oubia.me/' \
            -t '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest' \
            -t '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:${{ github.sha }}' \
            ./frontend
          docker push '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest'
          docker push '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:${{ github.sha }}'

      - name: Build and push ollama image
        run: |
          docker build -t '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:latest' -t '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:${{ github.sha }}' ./Ollama
          docker push '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:latest'
          docker push '${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:${{ github.sha }}'

      - name: Success notification
        if: success()
        run: |
          echo "✅ All images successfully pushed to ACR!"
          echo ""
          echo "Images ready at:"
          echo "  - ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest"
          echo "  - ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:latest"
          echo "  - ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:latest"
