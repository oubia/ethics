name: Deploy to Azure

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:latest
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            REACT_APP_BASE_URL=https://api.ethics.oubia.me/
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:${{ github.sha }}

      - name: Build and push ollama image
        uses: docker/build-push-action@v5
        with:
          context: ./Ollama
          push: true
          tags: |
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:latest
            ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:${{ github.sha }}

      - name: Success notification
        if: success()
        run: |
          echo "✅ All images successfully pushed to ACR!"
          echo ""
          echo "Images are ready at:"
          echo "  🐳 Frontend: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-frontend:latest"
          echo "  🐳 Backend: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-backend:latest"
          echo "  🐳 Ollama: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/ethics-ollama:latest"
